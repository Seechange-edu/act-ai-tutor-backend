name: Dev

on:
    release:
      types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: get tag info
        uses: Seechange-edu/Parse-Action-Tag@main
        with:
          githubToken: ${{ secrets.ACTION_TOKEN }}
          type: parse

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: SeeChange-edu/${{ env.REPOSITORY }}
          token: ${{ secrets.ACTION_TOKEN }}
          ref: ${{ env.BRANCH }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup AWS ECR Details (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Push
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-pf-aws-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get ECR login token
        id: ecr-login-token
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }})
          echo "token<<EOF" >> $GITHUB_OUTPUT
          echo "$ECR_TOKEN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Setup AWS ECR Details (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Push
          aws-region: ${{ vars.AWS_REGION }}


      - name: Build and push Docker image with cache
        env:
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          ACTIVE: ${{ env.ACTIVE }}
          IMAGE_TAG: ${{ env.BRANCH }}

        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker buildx build \
            --file Dockerfile \
            --tag ${IMAGE_URI} \
            --build-arg ENVIRONMENT=dev \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --build-arg ENVIRONMENT=${{ env.ACTIVE }} \
            . \
            --push

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_TOKEN: ${{ steps.ecr-login-token.outputs.token }}
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          IMAGE_URI: ${{ env.IMAGE_URI }}

        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_TOKEN,IMAGE_URI
          script: |
          
            # Login to AWS ECR using temporary token from GitHub Actions
            echo ${ECR_TOKEN} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            docker pull ${IMAGE_URI}
            if [ "$(docker ps -a --format '{{.Names}}' | grep -c ${{ env.NAME }})" -gt 0 ]; then 
              docker rm -f ${{ env.NAME }}
            fi
            docker run --name ${{ env.NAME }} -d \
              ${{ env.RUN_ARGS }} \
              -p ${{ env.OUT_PORT }}:${{ env.PORT }} \
              --restart unless-stopped \
              --env-file /home/forge/env.ai-tutor/${{ env.ACTIVE }}.env \
              ${IMAGE_URI}

            WORKER_NAME="${{ env.NAME }}-worker"
            if [ "$(docker ps -a --format '{{.Names}}' | grep -c ${WORKER_NAME})" -gt 0 ]; then 
              docker rm -f ${WORKER_NAME}
            fi
            docker run --name ${WORKER_NAME} -d \
              ${{ env.RUN_ARGS_WORKER }} \
              --restart unless-stopped \
              --env-file /home/forge/env.ai-tutor/${{ env.ACTIVE }}.env \
              ${IMAGE_URI} \
              python scripts/azure_pa_worker.py

            docker image prune --force
            docker container prune --force

      - name: Prune old semver Docker images
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.BRANCH }}
          ACTIVE: ${{ env.ACTIVE }}
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ACTIVE
          script: |
            IMAGE_PREFIX="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}"
            CURRENT="${IMAGE_TAG}"

            if ! echo "$CURRENT" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Skip prune: IMAGE_TAG '${CURRENT}' is not semver"
              exit 0
            fi

            mapfile -t TAGS < <(
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep "^${IMAGE_PREFIX}:" \
                | sed "s|^${IMAGE_PREFIX}:||" \
                | grep -E '^[vV][0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V
            )

            PREV=$(printf '%s\n' "${TAGS[@]}" | sort -V | awk -v cur="$CURRENT" '
              { a[++n]=$0 }
              END { for(i=1;i<=n;i++) if(a[i]==cur && i>1) { print a[i-1]; exit } }')

            if [ -n "$PREV" ]; then
              echo "Keep: ${CURRENT}, ${PREV}"
            else
              echo "Keep: ${CURRENT} only (no previous version)"
            fi

            for tag in "${TAGS[@]}"; do
              [ "$tag" = "$CURRENT" ] && continue
              [ -n "$PREV" ] && [ "$tag" = "$PREV" ] && continue
              echo "Removing ${IMAGE_PREFIX}:${tag}"
              docker rmi "${IMAGE_PREFIX}:${tag}" 2>/dev/null || true
            done

  notify-teams:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get Tag Info
        uses: Seechange-edu/Parse-Action-Tag@main
        with:
          githubToken: ${{ secrets.ACTION_TOKEN }}
          type: parse
          
      - name: Send Teams Notification
        env:
          WEBHOOK: ${{ env.TEAMS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "${{ needs.build.result == 'success' && '00FF00' || 'FF0000' }}",
            "summary": "${{ needs.build.result == 'success' && '🎉 Build succeeded!' || '❌ Build failed!' }}: ${{ github.workflow }}",
            "title": "${{ needs.build.result == 'success' && '🎉 Build succeeded!' || '❌ Build failed!' }}: ${{ github.workflow }}",
            "sections": [{
              "facts": [
                { "name": "Repository", "value": "${{ github.repository }}" },
                { "name": "Triggered by", "value": "${{ github.event_name }}" },
                { "name": "Commit Message", "value": "${{ github.event.head_commit.message }}" },
                { "name": "Author", "value": "@${{ github.actor }}" },
                { "name": "Result", "value": "${{ needs.build.result }}" }
              ],
              "text": "[View Workflow Run](${{ env.RUN_URL }})"
            }]
          }' \
          "$WEBHOOK"
